<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">RAG Hybrid Search high-level architecture</title>
  <desc id="desc">Document ingestion and question-answering flows through the Spring Boot application and its local services.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172554} .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#475569}.group{font-size:16px;font-weight:700}.label{font-size:14px;font-weight:700}.small{font-size:12px;fill:#475569}.box{stroke-width:1.5;rx:10;ry:10}.arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="840" fill="#f8fafc"/>
  <text x="52" y="52" class="title">RAG Hybrid Search — High-Level Architecture</text>
  <text x="52" y="78" class="subtitle">Asynchronous document ingestion · hybrid retrieval · grounded generation · evaluation</text>

  <rect x="42" y="112" width="1356" height="292" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="66" y="144" class="group">1. Document ingestion and indexing</text>
  <rect class="box" x="68" y="180" width="145" height="78" fill="#fef3c7" stroke="#f59e0b"/><text x="110" y="211" class="label">User / Client</text><text x="92" y="233" class="small">Upload document</text>
  <rect class="box" x="270" y="180" width="178" height="78" fill="#ffffff" stroke="#60a5fa"/><text x="307" y="211" class="label">Spring Boot API</text><text x="298" y="233" class="small">DocumentController</text>
  <rect class="box" x="505" y="170" width="194" height="98" fill="#ffffff" stroke="#60a5fa"/><text x="538" y="202" class="label">Ingestion Service</text><text x="529" y="224" class="small">Tika · metadata · hash</text><text x="534" y="244" class="small">job registration</text>
  <rect class="box" x="756" y="170" width="160" height="98" fill="#ede9fe" stroke="#8b5cf6"/><text x="805" y="202" class="label">PostgreSQL</text><text x="784" y="224" class="small">documents · jobs</text><text x="790" y="244" class="small">chunk metadata</text>
  <rect class="box" x="973" y="180" width="130" height="78" fill="#fee2e2" stroke="#ef4444"/><text x="1013" y="211" class="label">Kafka</text><text x="993" y="233" class="small">ingestion job</text>
  <rect class="box" x="1160" y="170" width="185" height="98" fill="#ffffff" stroke="#60a5fa"/><text x="1188" y="202" class="label">Consumer Pipeline</text><text x="1190" y="224" class="small">chunk · embed · retry</text><text x="1195" y="244" class="small">mark INDEXED</text>
  <path class="arrow" d="M213 219H270"/><path class="arrow" d="M448 219H505"/><path class="arrow" d="M699 199H756"/><path class="arrow" d="M699 239H973"/><path class="arrow" d="M1103 219H1160"/>
  <rect class="box" x="1090" y="304" width="255" height="70" fill="#dcfce7" stroke="#22c55e"/><text x="1136" y="333" class="label">Qdrant Vector Database</text><text x="1124" y="355" class="small">BGE-M3 dense + sparse vectors</text><path class="arrow" d="M1252 268V304"/>

  <rect x="42" y="432" width="1356" height="322" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="66" y="464" class="group">2. Question answering and evaluation</text>
  <rect class="box" x="68" y="510" width="145" height="78" fill="#fef3c7" stroke="#f59e0b"/><text x="110" y="541" class="label">User / Client</text><text x="86" y="563" class="small">Ask a question</text>
  <rect class="box" x="270" y="510" width="178" height="78" fill="#ffffff" stroke="#60a5fa"/><text x="309" y="541" class="label">Query API</text><text x="300" y="563" class="small">QueryController</text>
  <rect class="box" x="505" y="500" width="190" height="98" fill="#ffffff" stroke="#60a5fa"/><text x="535" y="532" class="label">Query Embedding</text><text x="535" y="554" class="small">BGE-M3 dense + sparse</text><text x="540" y="574" class="small">authority scope</text>
  <rect class="box" x="752" y="500" width="185" height="98" fill="#dcfce7" stroke="#22c55e"/><text x="785" y="532" class="label">Qdrant Search</text><text x="773" y="554" class="small">dense · sparse · RRF</text><text x="781" y="574" class="small">candidate chunks</text>
  <rect class="box" x="994" y="500" width="160" height="98" fill="#ffffff" stroke="#60a5fa"/><text x="1026" y="532" class="label">Reranker</text><text x="1022" y="554" class="small">BGE cross-encoder</text><text x="1022" y="574" class="small">context filtering</text>
  <rect class="box" x="1211" y="500" width="145" height="98" fill="#ffedd5" stroke="#f97316"/><text x="1254" y="532" class="label">Ollama</text><text x="1246" y="554" class="small">Qwen3 generation</text><text x="1234" y="574" class="small">cited answer</text>
  <path class="arrow" d="M213 549H270"/><path class="arrow" d="M448 549H505"/><path class="arrow" d="M695 549H752"/><path class="arrow" d="M937 549H994"/><path class="arrow" d="M1154 549H1211"/>
  <rect class="box" x="960" y="656" width="190" height="66" fill="#ffffff" stroke="#60a5fa"/><text x="996" y="684" class="label">Citation Verification</text><text x="1001" y="705" class="small">sources + confidence</text><path class="arrow" d="M1284 598V630H1055V656"/>
  <rect class="box" x="580" y="656" width="215" height="66" fill="#ffffff" stroke="#60a5fa"/><text x="632" y="684" class="label">Evaluation Service</text><text x="603" y="705" class="small">MRR · recall · correctness</text><path class="dash" d="M752 598V630H687V656"/><path class="dash" d="M1055 656H795"/>
  <text x="68" y="790" class="small">All integrations are configured as Spring-managed beans; PostgreSQL, Kafka, Qdrant, and Ollama run locally in the current setup.</text>
</svg>
